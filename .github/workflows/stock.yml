name: Stock check & deploy

on:
  schedule:
    # GitHub runs this at most every 5 min (often later under load).
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_push:
        description: Send a test notification to all subscribed devices
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Restore previous stock state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: stock-state-${{ github.run_id }}
          restore-keys: stock-state-

      - name: Check Apple pickup stock
        env:
          # Scheduled runs check every ~20s for ~4 min, filling the gap until the next 5-min cron.
          POLL_DURATION_SECONDS: ${{ github.event_name == 'schedule' && (vars.POLL_DURATION_SECONDS || '240') || '0' }}
          POLL_INTERVAL_SECONDS: ${{ vars.POLL_INTERVAL_SECONDS || '20' }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        # Test push on demand, or automatically when a new device is added to subscriptions/.
        run: node scripts/check.mjs ${{ (inputs.test_push || (github.event_name == 'push' && contains(join(github.event.commits.*.added, ','), 'subscriptions/'))) && '--test-push' || '' }}

      - name: Save stock state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: stock-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build site
        env:
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
        run: node scripts/build-site.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
